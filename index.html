<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SunVolt Energy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcfcfc;
            color: #333;
        }

        /* Banner Section */
        .hero-banner {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1509391365360-2e959784a276?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            height: 250px;
            display: flex;
            align-items: center;
            padding-left: 10%;
            color: #ffffff;
        }

        .hero-banner h1 {
            font-size: 2.2rem;
            font-weight: 600;
        }

        /* Form Container */
        .container {
            max-width: 600px;
            margin: -40px auto 60px;
            background: #ffffff;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 10px;
        }

        .logo-container img {
            max-width: 200px;
            height: auto;
        }

        .company-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #222;
        }

        .contact-info {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .contact-info p {
            margin-bottom: 8px;
        }

        /* Form Controls */
        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #444;
            margin-bottom: 6px;
        }

        .form-group label span.required {
            color: #d9534f;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background-color: #f0f0f4;
            border: 1px solid #e0e0e0;
            border-radius: 2px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #ff9900;
            background-color: #fff;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 90px;
        }

        .submit-btn {
            background-color: #e60023;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 2px;
            text-transform: uppercase;
            float: left;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: #cc001f;
        }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <div class="hero-banner">
        <h1>Contact us<br>by filling out the form below</h1>
    </div>

    <!-- Main Content Container -->
    <div class="container">
        
        <!-- SunVolt Logo Header -->
        <div class="logo-container">
            <img src="https://sunvolt-energy-dev-ed.develop.my.salesforce.com/sfc/dist/version/renditionDownload?rendition=ORIGINAL_Png&versionId=068bm00000LozvR&operationContext=DELIVERY&contentId=05Tbm00000XtPCT&page=0&d=/a/bm000000LU4j/ji9MQF2FD0jTxxxyjdV2hULpU93xvQTP9ttasPOPq_A&oid=00Dbm00000sxw45&dpt=null&viewId=" alt="SunVolt Energy Logo">
        </div>
        <div class="company-title">Sunvolt Energy India Pvt Ltd.</div>
        
        <!-- Contact Information Block -->
        <div class="contact-info">
            <p>📍 753, 25th Main Rd, Purnapragnya Layout, Poornapragna Housing Society L, Poornapragna Housing Society Layout
Bengaluru</p>
            <p>📞 Phone: +91-44-42111877</p>
            <p>✉️ Email: info@sunvoltenergy.com</p>
        </div>

        <!-- Salesforce Web-to-Lead Form -->
        <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Dbm00000sxw45" method="POST">

            <!-- Hidden Salesforce Parameters -->
            <input type="hidden" name="oid" value="00Dbm00000sxw45">
            <input type="hidden" name="retURL" value="http://google.com">
            <input type="hidden" id="lead_source" name="lead_source" value="Web">

            <!-- First Name -->
            <div class="form-group">
                <label for="first_name">Your Name <span class="required">*</span></label>
                <input id="first_name" maxlength="40" name="first_name" size="20" type="text" class="form-control" required />
            </div>

            <!-- Last Name -->
            <div class="form-group">
                <label for="last_name">Last Name <span class="required">*</span></label>
                <input id="last_name" maxlength="80" name="last_name" size="20" type="text" class="form-control" required />
            </div>

            <!-- Company -->
            <div class="form-group">
                <label for="company">Company <span class="required">*</span></label>
                <input id="company" maxlength="40" name="company" size="20" type="text" class="form-control" required />
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input id="email" maxlength="80" name="email" size="20" type="email" class="form-control" required />
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone</label>
                <input id="phone" maxlength="40" name="phone" size="20" type="tel" class="form-control" />
            </div>

            <!-- City -->
            <div class="form-group">
                <label for="city">City</label>
                <input id="city" maxlength="40" name="city" size="20" type="text" class="form-control" />
            </div>

            <!-- Submit Button -->
            <button type="submit" name="submit" class="submit-btn">SUBMIT</button>

        </form>
    </div>

</body>
</html>
